<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Расчёт аванса — Neon V3</title>
<style>
  * { box-sizing: border-box; margin: 0; }
  body {
    min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px;
    font-family: 'Segoe UI', Inter, 'Helvetica Neue', Arial, sans-serif; color: #fff; overflow: hidden;
    background: linear-gradient(135deg, #022c22, #064e3b 50%, #0f766e); background-size: 200% 200%;
    animation: shift 18s ease-in-out infinite;
  }
  @keyframes shift { 0%,100% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } }

  /* --- анимированный фон --- */
  .bg { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
  .blob { position: absolute; border-radius: 50%; filter: blur(70px); opacity: .55; }
  .b1 { width: 480px; height: 480px; background: #10b981; top: -120px; left: -100px; animation: f1 16s ease-in-out infinite; }
  .b2 { width: 420px; height: 420px; background: #06b6d4; bottom: -140px; right: -90px; animation: f2 20s ease-in-out infinite; }
  .b3 { width: 320px; height: 320px; background: #a3e635; top: 40%; left: 55%; opacity: .25; animation: f3 24s ease-in-out infinite; }
  @keyframes f1 { 0%,100% { transform: translate(0,0) scale(1); } 50% { transform: translate(120px,90px) scale(1.2); } }
  @keyframes f2 { 0%,100% { transform: translate(0,0) scale(1); } 50% { transform: translate(-140px,-80px) scale(1.15); } }
  @keyframes f3 { 0%,100% { transform: translate(0,0); } 50% { transform: translate(-160px,60px) scale(1.3); } }
  .dot { position: absolute; bottom: -20px; border-radius: 50%; background: rgba(255,255,255,.35);
         animation: rise linear infinite; }
  @keyframes rise { to { transform: translateY(-110vh) translateX(var(--dx)); opacity: 0; } }

  .card {
    position: relative; z-index: 1; width: 100%; max-width: 400px; padding: 34px; border-radius: 28px;
    background: rgba(255,255,255,.10); border: 1px solid rgba(255,255,255,.22);
    backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
    box-shadow: 0 24px 60px rgba(0,0,0,.35);
  }
  h1 { font-size: 28px; }
  .subtitle { margin-top: 4px; font-size: 13px; color: rgba(255,255,255,.7); }
  .view { margin-top: 24px; transition: opacity .45s ease, transform .45s ease; }
  .view.hidden { opacity: 0; transform: translateY(-16px); pointer-events: none; }
  .view.gone { display: none; }
  label { display: block; margin-bottom: 16px; }
  label span { display: block; margin-bottom: 6px; font-size: 12px; font-weight: 700;
               text-transform: uppercase; color: rgba(255,255,255,.85); }
  input {
    width: 100%; padding: 12px 16px; font-size: 16px; color: #fff; outline: none;
    border-radius: 14px; border: 1px solid rgba(255,255,255,.2); background: rgba(255,255,255,.12);
    transition: border-color .2s, background .2s, box-shadow .2s;
  }
  input::placeholder { color: rgba(255,255,255,.4); }
  input:focus { border-color: #6ee7b7; background: rgba(255,255,255,.18); box-shadow: 0 0 14px rgba(110,231,183,.55); }
  .error { min-height: 18px; margin-bottom: 8px; font-size: 12px; color: #fecdd3; }
  button {
    width: 100%; padding: 13px; font-size: 15px; font-weight: 700; color: #022c22; cursor: pointer;
    border: 0; border-radius: 14px; transition: transform .1s, filter .2s, background .2s;
  }
  button:active { transform: scale(.98); }
  .primary { background: linear-gradient(90deg, #34d399, #22d3ee); }
  .primary:hover { filter: brightness(1.1); }
  .primary:disabled { opacity: .6; cursor: wait; }
  .ghost { margin-top: 22px; font-weight: 500; font-size: 14px; background: transparent;
           border: 1px solid rgba(255,255,255,.35); color: rgba(255,255,255,.9); }
  .ghost:hover { background: rgba(255,255,255,.12); }
  #result { text-align: center; }
  #result .caption { font-size: 14px; color: rgba(255,255,255,.75); }
  #amount { margin: 8px 0 14px; font-size: 44px; font-weight: 700; font-variant-numeric: tabular-nums; }
  #result .detail { margin-top: 6px; font-size: 14px; color: rgba(255,255,255,.8); }

  .version { position: fixed; bottom: 14px; left: 0; right: 0; z-index: 1; text-align: center;
             font-size: 12px; letter-spacing: .12em; color: rgba(255,255,255,.55); }

  /* V3: aurora / neon design */
  body { overflow-x: hidden; overflow-y: auto; background: linear-gradient(125deg,#070b25,#191044 42%,#092f50 76%,#170b38); background-size: 350% 350%; animation: shift 14s ease infinite; }
  body::before { content:""; position:fixed; inset:0; pointer-events:none; opacity:.19; z-index:0;
    background-image:linear-gradient(rgba(255,255,255,.13) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.13) 1px,transparent 1px);
    background-size:56px 56px; mask-image:linear-gradient(to bottom,transparent,#000 55%,transparent); }
  .b1 { background:#8b5cf6; opacity:.65; }
  .b2 { background:#0ea5e9; opacity:.65; }
  .b3 { background:#f472b6; opacity:.4; }
  .card { max-width:440px; padding:36px; border-radius:30px; overflow:hidden;
    background:rgba(12,17,48,.68); border:1px solid rgba(165,180,252,.35);
    box-shadow:0 30px 100px rgba(3,5,26,.65),0 0 60px rgba(139,92,246,.15);
    animation: cardEnter .85s cubic-bezier(.2,.9,.25,1) both;
    transition:transform .18s ease-out,box-shadow .25s ease; }
  .card::before { content:""; position:absolute; inset:0 0 auto; height:2px;
    background:linear-gradient(90deg,transparent,#a78bfa,#22d3ee,#f472b6,transparent);
    background-size:200% 100%; animation:glowLine 5s linear infinite; }
  .card::after { content:""; position:absolute; width:210px; height:210px; right:-125px; top:-125px;
    border-radius:50%; background:rgba(167,139,250,.15); filter:blur(35px); pointer-events:none; }
  @keyframes glowLine { to { background-position:200% 0; } }
  @keyframes cardEnter { from { opacity:0; transform:translateY(28px) scale(.95); } to { opacity:1; transform:translateY(0) scale(1); } }
  .eyebrow { display:inline-flex; align-items:center; gap:8px; padding:7px 12px; margin-bottom:20px;
    border:1px solid rgba(167,139,250,.35); background:rgba(139,92,246,.14); border-radius:999px;
    font-size:10px; font-weight:800; letter-spacing:.17em; color:#ddd6fe; }
  .eyebrow .live { width:7px; height:7px; border-radius:50%; background:#22d3ee;
    box-shadow:0 0 0 4px rgba(34,211,238,.12),0 0 14px #22d3ee; animation:pulse 2s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity:.45; transform:scale(.75); } }
  h1 { font-size:clamp(27px,6vw,34px); letter-spacing:-.045em; line-height:1.12;
    background:linear-gradient(100deg,#fff 20%,#c4b5fd 60%,#67e8f9); background-clip:text; -webkit-background-clip:text; color:transparent; }
  .subtitle { margin-top:10px; line-height:1.55; color:#b8c3e6; }
  label span { color:#c4b5fd; font-size:11px; letter-spacing:.08em; }
  input { background:rgba(11,18,52,.8); border-color:rgba(165,180,252,.22); padding:15px 17px;
    transition:transform .2s,border-color .2s,box-shadow .2s,background .2s; }
  input:focus { border-color:#a78bfa; background:rgba(30,26,76,.95); transform:translateY(-2px);
    box-shadow:0 0 0 3px rgba(139,92,246,.16),0 0 24px rgba(139,92,246,.2); }
  .primary { position:relative; overflow:hidden; padding:16px; color:#0a0b28;
    background:linear-gradient(105deg,#a78bfa,#67e8f9 55%,#f0abfc); background-size:200% 100%;
    box-shadow:0 8px 30px rgba(139,92,246,.28); transition:transform .2s,box-shadow .2s,background-position .4s; }
  .primary::after { content:""; position:absolute; inset:0; transform:translateX(-130%) skewX(-20deg);
    background:linear-gradient(90deg,transparent,rgba(255,255,255,.5),transparent); transition:transform .6s; }
  .primary:hover { transform:translateY(-3px); box-shadow:0 14px 36px rgba(139,92,246,.4); background-position:100% 0; }
  .primary:hover::after { transform:translateX(130%) skewX(-20deg); }
  .primary:disabled { transform:none; }
  .ghost { border-color:rgba(167,139,250,.5); }
  .ghost:hover { background:rgba(139,92,246,.17); }
  #amount { font-size:clamp(34px,8vw,48px); letter-spacing:-.04em; color:#a5f3fc;
    text-shadow:0 0 30px rgba(34,211,238,.35); }
  #result.reveal #amount { animation:resultPop .65s cubic-bezier(.2,1.6,.4,1); }
  @keyframes resultPop { from { transform:scale(.7); opacity:.2; } to { transform:scale(1); opacity:1; } }
  .version { position:relative; padding:14px 0 0; bottom:auto; font-size:11px; letter-spacing:.18em; color:#a5b4fc; }
  .version strong { color:#67e8f9; }
  .spark { position:fixed; pointer-events:none; z-index:4; width:7px; height:7px; border-radius:2px;
    background:var(--spark-color,#a78bfa); box-shadow:0 0 10px var(--spark-color,#a78bfa);
    animation:sparkFly .85s ease-out forwards; }
  @keyframes sparkFly { to { transform:translate(var(--sx),var(--sy)) rotate(280deg) scale(.1); opacity:0; } }
  @media (max-width:480px) { .card { padding:26px 22px; } body { padding:16px; } }
  @media (prefers-reduced-motion: reduce) { *, body { animation: none !important; } }

  /* Поля появляются по очереди в течение первых двух секунд */
  @keyframes fieldEntrance {
    from { opacity: 0; transform: translateY(24px); filter: blur(7px); }
    to { opacity: 1; transform: translateY(0); filter: blur(0); }
  }
  #form > label, #form > .error, #form > #calc {
    animation: fieldEntrance .85s cubic-bezier(.2,.8,.2,1) both;
  }
  #form > label:nth-of-type(1) { animation-delay: .25s; }
  #form > label:nth-of-type(2) { animation-delay: .58s; }
  #form > label:nth-of-type(3) { animation-delay: .91s; }
  #form > .error { animation-delay: 1.18s; }
  #form > #calc { animation-delay: 1.15s; }
  @media (prefers-reduced-motion: reduce) {
    #form > label, #form > .error, #form > #calc { animation: none !important; }
  }
</style>
</head>
<body>
<div class="bg" id="bg">
  <div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div>
</div>

<main class="card">
  <h1>Расчёт аванса</h1>
  <p class="subtitle" id="subtitle">Введите данные — остальное посчитаем сами</p>

  <div class="view" id="form">
    <label><span>Оклад, ₽</span>
      <input id="salary" inputmode="decimal" placeholder="Например, 85 000" autocomplete="off"></label>
    <label><span>Рабочих дней в месяце</span>
      <input id="monthDays" inputmode="decimal" placeholder="Например, 22" autocomplete="off"></label>
    <label><span>Мои отработанные дни</span>
      <input id="workedDays" inputmode="decimal" placeholder="Например, 11" autocomplete="off"></label>
    <div class="error" id="error"></div>
    <button class="primary" id="calc">Рассчитать</button>
  </div>

  <div class="view hidden gone" id="result">
    <div class="caption">Аванс к выдаче</div>
    <div id="amount">0,00 ₽</div>
    <div class="detail" id="gross"></div>
    <div class="detail" id="tax"></div>
    <button class="ghost" id="again">Рассчитать заново</button>
  </div>
</main>


<script>
const $ = id => document.getElementById(id);
const fmt = v => new Intl.NumberFormat('ru-RU', { style: 'currency', currency: 'RUB' }).format(v);
const num = s => parseFloat(s.replace(/\s/g, '').replace(',', '.'));
const wait = ms => new Promise(r => setTimeout(r, ms));

// всплывающие пузырьки на фоне
for (let i = 0; i < 22; i++) {
  const d = document.createElement('span');
  const s = 4 + Math.random() * 10;
  d.className = 'dot';
  d.style.cssText = `left:${Math.random() * 100}%;width:${s}px;height:${s}px;` +
    `animation-duration:${10 + Math.random() * 14}s;animation-delay:${-Math.random() * 20}s;` +
    `--dx:${(Math.random() - .5) * 120}px`;
  $('bg').appendChild(d);
}

['salary', 'monthDays', 'workedDays'].forEach(id => {
  $(id).addEventListener('input', e => {
    if (!/^[0-9 ]*([.,][0-9]{0,2})?$/.test(e.target.value))
      e.target.value = e.target.value.slice(0, -1);
  });
  $(id).addEventListener('keydown', e => { if (e.key === 'Enter') calculate(); });
});
$('calc').addEventListener('click', calculate);
$('again').addEventListener('click', reset);

async function calculate() {
  const body = {
    salary: num($('salary').value),
    monthDays: num($('monthDays').value),
    workedDays: num($('workedDays').value),
  };
  if (Object.values(body).some(isNaN)) { $('error').textContent = 'Заполните все поля числами'; return; }

  $('calc').disabled = true;
  try {
    const res = await fetch('/api/calculate', {
      method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body),
    });
    const data = await res.json();
    if (!res.ok) { $('error').textContent = data.message || 'Ошибка расчёта'; return; }

    $('error').textContent = '';
    $('gross').textContent = 'Начислено: ' + fmt(data.gross);
    $('tax').textContent = 'НДФЛ 13%: −' + fmt(data.tax);
    $('subtitle').textContent = 'Готово! Вот ваш аванс';

    $('form').classList.add('hidden');
    await wait(450);
    $('form').classList.add('gone');
    $('result').classList.remove('gone');
    await wait(20);
    $('result').classList.remove('hidden');
    countUp(data.net);
    $('result').classList.remove('reveal');
    void $('result').offsetWidth;
    $('result').classList.add('reveal');
    celebrate();
  } catch (e) {
    $('error').textContent = 'Нет связи с сервером';
  } finally {
    $('calc').disabled = false;
  }
}

function countUp(target) {
  const start = performance.now(), dur = 1100;
  (function tick(now) {
    const t = Math.min((now - start) / dur, 1);
    $('amount').textContent = fmt(target * (1 - Math.pow(1 - t, 3)));
    if (t < 1) requestAnimationFrame(tick);
  })(start);
}

function celebrate() {
  if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const rect = $('amount').getBoundingClientRect();
  const cx = rect.left + rect.width / 2, cy = rect.top + rect.height / 2;
  const colors = ['#a78bfa','#67e8f9','#f0abfc','#fff'];
  for (let i = 0; i < 26; i++) {
    const dot = document.createElement('span');
    dot.className = 'spark';
    const angle = (i / 26) * Math.PI * 2;
    const dist = 65 + Math.random() * 130;
    dot.style.left = cx + 'px'; dot.style.top = cy + 'px';
    dot.style.setProperty('--sx', Math.cos(angle) * dist + 'px');
    dot.style.setProperty('--sy', Math.sin(angle) * dist + 'px');
    dot.style.setProperty('--spark-color', colors[i % colors.length]);
    document.body.appendChild(dot);
    dot.addEventListener('animationend', () => dot.remove(), {once:true});
  }
}

// Subtle cursor-reactive glow on the card
if (window.matchMedia('(pointer:fine) and (prefers-reduced-motion: no-preference)').matches) {
  const card = document.querySelector('.card');
  card.addEventListener('pointermove', e => {
    const r = card.getBoundingClientRect();
    const x = (e.clientX - r.left) / r.width - .5;
    const y = (e.clientY - r.top) / r.height - .5;
    card.style.transform = `perspective(900px) rotateY(${x * 3}deg) rotateX(${-y * 3}deg)`;
  });
  card.addEventListener('pointerleave', () => { card.style.transform = ''; });
}

async function reset() {
  $('subtitle').textContent = 'Введите данные — остальное посчитаем сами';
  $('result').classList.remove('reveal');
  $('result').classList.add('hidden');
  await wait(450);
  $('result').classList.add('gone');
  $('form').classList.remove('gone');
  await wait(20);
  $('form').classList.remove('hidden');
}
</script>
</body>
</html>
