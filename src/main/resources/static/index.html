<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Расчёт аванса</title>
<style>
  * { box-sizing: border-box; margin: 0; }
  body {
    min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px;
    font-family: 'Segoe UI', Inter, 'Helvetica Neue', Arial, sans-serif; color: #fff; overflow: hidden;
    background: linear-gradient(135deg, #022c22, #064e3b 50%, #0f766e); background-size: 200% 200%;
    animation: shift 18s ease-in-out infinite;
  }
  @keyframes shift { 0%,100% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } }

  /* --- анимированный фон --- */
  .bg { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
  .blob { position: absolute; border-radius: 50%; filter: blur(70px); opacity: .55; }
  .b1 { width: 480px; height: 480px; background: #10b981; top: -120px; left: -100px; animation: f1 16s ease-in-out infinite; }
  .b2 { width: 420px; height: 420px; background: #06b6d4; bottom: -140px; right: -90px; animation: f2 20s ease-in-out infinite; }
  .b3 { width: 320px; height: 320px; background: #a3e635; top: 40%; left: 55%; opacity: .25; animation: f3 24s ease-in-out infinite; }
  @keyframes f1 { 0%,100% { transform: translate(0,0) scale(1); } 50% { transform: translate(120px,90px) scale(1.2); } }
  @keyframes f2 { 0%,100% { transform: translate(0,0) scale(1); } 50% { transform: translate(-140px,-80px) scale(1.15); } }
  @keyframes f3 { 0%,100% { transform: translate(0,0); } 50% { transform: translate(-160px,60px) scale(1.3); } }
  .dot { position: absolute; bottom: -20px; border-radius: 50%; background: rgba(255,255,255,.35);
         animation: rise linear infinite; }
  @keyframes rise { to { transform: translateY(-110vh) translateX(var(--dx)); opacity: 0; } }

  .card {
    position: relative; z-index: 1; width: 100%; max-width: 400px; padding: 34px; border-radius: 28px;
    background: rgba(255,255,255,.10); border: 1px solid rgba(255,255,255,.22);
    backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
    box-shadow: 0 24px 60px rgba(0,0,0,.35);
  }
  h1 { font-size: 28px; }
  .subtitle { margin-top: 4px; font-size: 13px; color: rgba(255,255,255,.7); }
  .view { margin-top: 24px; transition: opacity .45s ease, transform .45s ease; }
  .view.hidden { opacity: 0; transform: translateY(-16px); pointer-events: none; }
  .view.gone { display: none; }
  label { display: block; margin-bottom: 16px; }
  label span { display: block; margin-bottom: 6px; font-size: 12px; font-weight: 700;
               text-transform: uppercase; color: rgba(255,255,255,.85); }
  input {
    width: 100%; padding: 12px 16px; font-size: 16px; color: #fff; outline: none;
    border-radius: 14px; border: 1px solid rgba(255,255,255,.2); background: rgba(255,255,255,.12);
    transition: border-color .2s, background .2s, box-shadow .2s;
  }
  input::placeholder { color: rgba(255,255,255,.4); }
  input:focus { border-color: #6ee7b7; background: rgba(255,255,255,.18); box-shadow: 0 0 14px rgba(110,231,183,.55); }
  .error { min-height: 18px; margin-bottom: 8px; font-size: 12px; color: #fecdd3; }
  button {
    width: 100%; padding: 13px; font-size: 15px; font-weight: 700; color: #022c22; cursor: pointer;
    border: 0; border-radius: 14px; transition: transform .1s, filter .2s, background .2s;
  }
  button:active { transform: scale(.98); }
  .primary { background: linear-gradient(90deg, #34d399, #22d3ee); }
  .primary:hover { filter: brightness(1.1); }
  .primary:disabled { opacity: .6; cursor: wait; }
  .ghost { margin-top: 22px; font-weight: 500; font-size: 14px; background: transparent;
           border: 1px solid rgba(255,255,255,.35); color: rgba(255,255,255,.9); }
  .ghost:hover { background: rgba(255,255,255,.12); }
  #result { text-align: center; }
  #result .caption { font-size: 14px; color: rgba(255,255,255,.75); }
  #amount { margin: 8px 0 14px; font-size: 44px; font-weight: 700; font-variant-numeric: tabular-nums; }
  #result .detail { margin-top: 6px; font-size: 14px; color: rgba(255,255,255,.8); }

  .version { position: fixed; bottom: 14px; left: 0; right: 0; z-index: 1; text-align: center;
             font-size: 12px; letter-spacing: .12em; color: rgba(255,255,255,.55); }

  @media (prefers-reduced-motion: reduce) { *, body { animation: none !important; } }
</style>
</head>
<body>
<div class="bg" id="bg">
  <div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div>
</div>

<main class="card">
  <h1>Расчёт аванса</h1>
  <p class="subtitle" id="subtitle">Введите данные — остальное посчитаем сами</p>

  <div class="view" id="form">
    <label><span>Оклад, ₽</span>
      <input id="salary" inputmode="decimal" placeholder="Например, 85 000" autocomplete="off"></label>
    <label><span>Рабочих дней в месяце</span>
      <input id="monthDays" inputmode="decimal" placeholder="Например, 22" autocomplete="off"></label>
    <label><span>Мои отработанные дни</span>
      <input id="workedDays" inputmode="decimal" placeholder="Например, 11" autocomplete="off"></label>
    <div class="error" id="error"></div>
    <button class="primary" id="calc">Рассчитать</button>
  </div>

  <div class="view hidden gone" id="result">
    <div class="caption">Аванс к выдаче</div>
    <div id="amount">0,00 ₽</div>
    <div class="detail" id="gross"></div>
    <div class="detail" id="tax"></div>
    <button class="ghost" id="again">Рассчитать заново</button>
  </div>
</main>

<div class="version">v3</div>

<script>
const $ = id => document.getElementById(id);
const fmt = v => new Intl.NumberFormat('ru-RU', { style: 'currency', currency: 'RUB' }).format(v);
const num = s => parseFloat(s.replace(/\s/g, '').replace(',', '.'));
const wait = ms => new Promise(r => setTimeout(r, ms));

// всплывающие пузырьки на фоне
for (let i = 0; i < 22; i++) {
  const d = document.createElement('span');
  const s = 4 + Math.random() * 10;
  d.className = 'dot';
  d.style.cssText = `left:${Math.random() * 100}%;width:${s}px;height:${s}px;` +
    `animation-duration:${10 + Math.random() * 14}s;animation-delay:${-Math.random() * 20}s;` +
    `--dx:${(Math.random() - .5) * 120}px`;
  $('bg').appendChild(d);
}

['salary', 'monthDays', 'workedDays'].forEach(id => {
  $(id).addEventListener('input', e => {
    if (!/^[0-9 ]*([.,][0-9]{0,2})?$/.test(e.target.value))
      e.target.value = e.target.value.slice(0, -1);
  });
  $(id).addEventListener('keydown', e => { if (e.key === 'Enter') calculate(); });
});
$('calc').addEventListener('click', calculate);
$('again').addEventListener('click', reset);

async function calculate() {
  const body = {
    salary: num($('salary').value),
    monthDays: num($('monthDays').value),
    workedDays: num($('workedDays').value),
  };
  if (Object.values(body).some(isNaN)) { $('error').textContent = 'Заполните все поля числами'; return; }

  $('calc').disabled = true;
  try {
    const res = await fetch('/api/calculate', {
      method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body),
    });
    const data = await res.json();
    if (!res.ok) { $('error').textContent = data.message || 'Ошибка расчёта'; return; }

    $('error').textContent = '';
    $('gross').textContent = 'Начислено: ' + fmt(data.gross);
    $('tax').textContent = 'НДФЛ 13%: −' + fmt(data.tax);
    $('subtitle').textContent = 'Готово! Вот ваш аванс';

    $('form').classList.add('hidden');
    await wait(450);
    $('form').classList.add('gone');
    $('result').classList.remove('gone');
    await wait(20);
    $('result').classList.remove('hidden');
    countUp(data.net);
  } catch (e) {
    $('error').textContent = 'Нет связи с сервером';
  } finally {
    $('calc').disabled = false;
  }
}

function countUp(target) {
  const start = performance.now(), dur = 1100;
  (function tick(now) {
    const t = Math.min((now - start) / dur, 1);
    $('amount').textContent = fmt(target * (1 - Math.pow(1 - t, 3)));
    if (t < 1) requestAnimationFrame(tick);
  })(start);
}

async function reset() {
  $('subtitle').textContent = 'Введите данные — остальное посчитаем сами';
  $('result').classList.add('hidden');
  await wait(450);
  $('result').classList.add('gone');
  $('form').classList.remove('gone');
  await wait(20);
  $('form').classList.remove('hidden');
}
</script>
</body>
</html>
